ombu.catalogue:
  path: '/market.json'
  defaults:
    _controller: '\Drupal\ombu\Controller\CatalogueController'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

ombu.openapi:
  path: '/openapi.json'
  defaults:
    _controller: '\Drupal\ombu\Controller\OpenApiController'
  methods: [GET]
  requirements:
    # Public: it describes public endpoints.
    _access: 'TRUE'

# Agents review what they bought, signed in with their wallet. The session
# is a cookie: CSRF token from /session/token in X-CSRF-Token.
ombu.review:
  path: '/market/listing/{commerce_product}/reviews'
  defaults:
    _controller: '\Drupal\ombu\Controller\ReviewController'
  methods: [POST]
  options:
    parameters:
      commerce_product:
        type: 'entity:commerce_product'
  requirements:
    commerce_product: \d+
    _entity_access: 'commerce_product.view'
    _permission: 'post comments'
    _csrf_request_header_token: 'TRUE'

# A seller lists their own x402 endpoint, for approval (SellForm).
ombu.sell:
  path: '/market/sell'
  defaults:
    _form: '\Drupal\ombu\Form\SellForm'
    _title: 'Sell on Ombú'
  requirements:
    _user_is_logged_in: 'TRUE'

ombu.similar_settings:
  path: '/admin/config/search/similar-services'
  defaults:
    _form: '\Drupal\ombu\Form\SimilarSettingsForm'
    _title: 'Similar services'
  requirements:
    _permission: 'administer search_api'

# similar.js reports what similar services a person saw and clicked
# (SimilarLog). Anyone may report; Flood caps a visitor's reports.
ombu.similar_event:
  path: '/similar/event'
  defaults:
    _controller: '\Drupal\ombu\Controller\SimilarEventController::post'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

# x402scan's compatibility discovery (the OpenAPI one is /openapi.json).
ombu.well_known_x402:
  path: '/.well-known/x402'
  defaults:
    _controller: '\Drupal\ombu\Controller\OpenApiController::wellKnown'
  methods: [GET]
  requirements:
    _access: 'TRUE'

# The older HTTP+SSE transport (2024-11-05) posted to /message; clients and
# agents that follow its documents try this address. It is the same server.
ombu.mcp_message:
  path: '/mcp/message'
  defaults:
    _controller: '\Drupal\mcp_server\Controller\McpServerController::handle'
    _title: 'MCP Server'
  requirements:
    _permission: 'access mcp server'
    _format: 'json'
  methods: [GET, POST, DELETE, OPTIONS]
  options:
    _auth: ['cookie']
    no_cache: TRUE
