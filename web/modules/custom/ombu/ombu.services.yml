services:
  ombu.circle_importer:
    class: Drupal\ombu\CircleCatalogImporter
    arguments:
      - '@http_client'
      - '@entity_type.manager'
      - '@logger.factory'
      - '@lock'
      - '@?Drupal\ai_provider_universal_factcheck\Service\PageFetcher'
      - '@ombu.sellers'
  # Checks a seller itself before a listing exists, with Alchemy's nodes
  # (ALCHEMY_API_KEY): only built when an importer is asked for.
  ombu.resource_verifier:
    class: Drupal\ombu\ResourceVerifier
    factory: ['Drupal\ombu\ResourceVerifierFactory', 'create']
    arguments: ['@http_client']
  ombu.bazaar_importer:
    class: Drupal\ombu\DiscoveryCatalogImporter
    arguments:
      - bazaar
      - 'https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources'
      - '@http_client'
      - '@entity_type.manager'
      - '@logger.factory'
      - '@lock'
      - '@ombu.resource_verifier'
      - '@state'
      - '@datetime.time'
  ombu.payai_importer:
    class: Drupal\ombu\DiscoveryCatalogImporter
    arguments:
      - payai
      - 'https://facilitator.payai.network/discovery/resources'
      - '@http_client'
      - '@entity_type.manager'
      - '@logger.factory'
      - '@lock'
      - '@ombu.resource_verifier'
      - '@state'
      - '@datetime.time'
  logger.channel.ombu:
    parent: logger.channel_base
    arguments: ['ombu']
  # The model sellers and the guarded fetch come from ai_provider_universal;
  # without it those sellers answer 503 and nothing is charged.
  ombu.sellers:
    class: Drupal\ombu\Sellers
    arguments:
      - '@key.repository'
      - '@logger.channel.ombu'
      - '@?Drupal\ai_provider_universal_factcheck\Service\PageFetcher'
      - '@?Drupal\ai_provider_universal_terms\Service\TermsAnalyzer'
      - '@?Drupal\ai_provider_universal_factcheck\Service\FactChecker'
      - '@http_client'
      - '@cache.default'
  ombu.seller_subscriber:
    class: Drupal\ombu\EventSubscriber\SellerSubscriber
    arguments: ['@ombu.sellers']
    tags:
      - { name: event_subscriber }
  ombu.agent_link_subscriber:
    class: Drupal\ombu\EventSubscriber\AgentLinkSubscriber
    arguments: ['@class_resolver']
    tags:
      - { name: event_subscriber }
  ombu.wallet_only_route_subscriber:
    class: Drupal\ombu\EventSubscriber\WalletOnlyRouteSubscriber
    tags:
      - { name: event_subscriber }
  ombu.review_verifier:
    class: Drupal\ombu\ReviewVerifier
    arguments: ['@http_client', '@database', '@ombu.sellers']
  Drupal\ombu\ReviewVerifier: '@ombu.review_verifier'
  ombu.embeddings:
    class: Drupal\ombu\Embeddings
    # Without the AI module there is no model: nothing is embedded.
    arguments: ['@database', '@?ai.provider', '@cache_tags.invalidator']
  Drupal\ombu\Embeddings: '@ombu.embeddings'
  ombu.similar:
    class: Drupal\ombu\Similar
    arguments: ['@config.factory', '@database', '@ombu.embeddings', '@entity_type.manager', '@views.executable', '@cache.default', '@datetime.time']
  Drupal\ombu\Similar: '@ombu.similar'
  ombu.similar_log:
    class: Drupal\ombu\SimilarLog
    arguments: ['@database', '@request_stack', '@current_user', '@datetime.time', '@language_manager', '@ombu.similar', '@cache.default', '@settings', '@logger.channel.ombu']
  Drupal\ombu\SimilarLog: '@ombu.similar_log'
  ombu.markdown_navigation_subscriber:
    class: Drupal\ombu\EventSubscriber\MarkdownNavigationSubscriber
    arguments: ['@router', '@string_translation']
    tags:
      - { name: event_subscriber }
  ombu.listing_markdown_subscriber:
    class: Drupal\ombu\EventSubscriber\ListingMarkdownSubscriber
    arguments: ['@ombu.similar', '@ombu.similar_log', '@entity_type.manager', '@entity.repository', '@string_translation', '@x402_pay.delivery', '@language_manager']
    tags:
      - { name: event_subscriber }
  # The blog's list as markdown (/blog.md): a view page, which x402_pay does not render.
  ombu.blog_markdown_subscriber:
    class: Drupal\ombu\EventSubscriber\BlogMarkdownSubscriber
    arguments: ['@entity_type.manager', '@entity.repository', '@language_manager', '@date.formatter', '@string_translation']
    tags:
      - { name: event_subscriber }
  ombu.similar_backend_subscriber:
    class: Drupal\ombu\EventSubscriber\SimilarBackendSubscriber
    tags:
      - { name: event_subscriber }
  # Charges for the MCP tool ombu_call_service; only used if mcp_server is on.
  ombu.mcp_payments:
    class: Drupal\ombu\Mcp\McpPayments
    arguments: ['@entity_type.manager', '@x402_pay.delivery', '@ombu.sellers', '@x402_pay.facilitators', '@x402_pay.claims', '@x402_pay.log', '@x402_pay.psr17', '@event_dispatcher', '@flood']
    tags:
      - { name: mcp_server.transport_middleware, priority: 100 }
