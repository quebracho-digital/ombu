# Included by the default virtual host (Dockerfile): a virtual host that has
# its own CustomLog does not inherit one from the server, and the rewrite
# below must run where the log is written.
#
# The real visitor: Cloudflare's tunnel connects from a LAN host, so the
# connection's address is always that host. The tunnel's own header names the
# visitor, and it is believed only when the connection comes from a private
# address (the tunnel is the only way in; this Apache is not published to the
# internet). REMOTE_ADDR is not touched: Drupal's proxy settings stay as they
# are. Only the log's `client_ip` changes.
RewriteEngine On
RewriteCond %{REMOTE_ADDR} ^(10\.|127\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|::1$)
RewriteCond %{HTTP:CF-Connecting-IP} ^([0-9a-fA-F:.]{3,45})$
RewriteRule ^ - [E=client_ip:%1]

# One file a day, in the volume, named by date. The docker log keeps its own
# copy (the image's access log, to stdout).
CustomLog "|/usr/bin/rotatelogs -l /var/log/ombu/access-%Y-%m-%d.log 86400" ombu_detailed
