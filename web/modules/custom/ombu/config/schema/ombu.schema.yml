plugin.plugin_configuration.facets_processor.ombu_chain_name:
  type: mapping
  label: 'Chain names (no settings)'

ombu.similar:
  type: config_object
  label: 'Similar services'
  mapping:
    terms:
      type: float
      label: 'Weight of the terms two listings share'
    vector:
      type: float
      label: 'Weight of how similar their texts are'
    per_provider:
      type: integer
      label: 'At most this many from one provider'
    fields:
      type: sequence
      label: 'Weight of each term field'
      sequence:
        type: float
        label: 'Weight'

views.style.ombu_cards:
  type: views_style
  label: 'Ombú listing cards'
  mapping:
    show_provider:
      type: boolean
      label: 'Show the provider'
    slider:
      type: boolean
      label: 'As a slider'

ombu.stop:
  type: config_object
  label: 'Stop switch'
  mapping:
    post:
      type: boolean
      label: 'Publish a blog post at each stop and each resume'
    templates:
      type: sequence
      label: 'The post, per language'
      orderby: key
      sequence:
        type: mapping
        label: 'Templates of a language'
        mapping:
          category:
            type: label
            label: 'Category'
          stop_title:
            type: label
            label: 'Title of a stop'
          stop_body:
            type: text
            label: 'Body of a stop'
          resume_title:
            type: label
            label: 'Title of a resume'
          resume_body:
            type: text
            label: 'Body of a resume'
          no_reason:
            type: label
            label: 'The reason, when none is given'
