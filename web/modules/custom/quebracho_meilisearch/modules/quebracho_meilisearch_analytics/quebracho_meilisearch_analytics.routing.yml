quebracho_meilisearch_analytics.click:
  path: '/meilisearch/analytics/click'
  defaults:
    _controller: '\Drupal\quebracho_meilisearch_analytics\Controller\ClickController::click'
  methods: [POST]
  requirements:
    # Anonymous visitors click results too. The controller validates the
    # payload, refuses cross-site requests and rate-limits clients.
    _access: 'TRUE'
  options:
    no_cache: TRUE
