# Ombú in production on SER5 (no DDEV there): `docker compose up -d --build`
# from this directory. The modules come from composer (drupal.org), like
# every other: `docker compose exec web composer install --no-dev`.
# Secrets in deploy/.env (git-ignored, mode 600): the sellers' keys, the
# LLM key, Circle's keys, the gas wallet, and the database's MARIADB_*.
# A second checkout runs dev beside it: its .env sets OMBU_STACK, OMBU_PORT
# and OMBU_HOST (another project, port and database), with testnet keys only.
name: ${OMBU_STACK:-ombu}

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OMBU_PROD: "1"
    # LAN only (minisforum's tunnel forwards here); Docker bypasses UFW, so
    # binding to the LAN address is what keeps it off other interfaces.
    ports:
      - "192.168.1.66:${OMBU_PORT:-8097}:80"
    volumes:
      - ..:/var/www/html
      # Apache's access log, a file a day (apache-logs.conf): it outlives a
      # rebuild, unlike the container's own log. Read it with logs-prune's
      # shell or from GoAccess: `docker compose exec logs-prune ls /logs`.
      - logs:/var/log/ombu
    depends_on:
      - db
      - meilisearch

  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: .env
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s

  # Search and "similar" listings (quebracho_meilisearch). Internal only, no
  # port published; the master key is MEILI_MASTER_KEY in .env, and
  # settings.prod.php hands it to search_api.server.meilisearch.
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    volumes:
      - meili:/meili_data

  # Deletes the access logs older than LOG_DAYS (default 90) once a day.
  logs-prune:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      LOG_DAYS: ${LOG_DAYS:-90}
    volumes:
      - logs:/logs
    command: >
      sh -c 'while true; do
      find /logs -name "access-*.log" -mtime +$$LOG_DAYS -delete;
      sleep 86400; done'

volumes:
  db:
  meili:
  logs:
