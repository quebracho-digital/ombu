# /market as a page: filters in a column, listings as cards. Belgrade's
# Bootstrap variables when present, plain fallbacks otherwise.
market:
  css:
    theme:
      css/market.css: {}
  js:
    js/market.js: {}
  dependencies:
    - core/drupal
    - core/once
# A listing's page: one readable column, details as a two-column list.
listing:
  css:
    theme:
      css/listing.css: {}
# The site's name as its mark, on every page.
brand:
  css:
    theme:
      css/brand.css: {}
# The latest sales on chain: relative times in the visitor's language.
sales:
  css:
    theme:
      css/sales.css: {}
  js:
    js/sales.js: {}
  dependencies:
    - core/drupal
    - core/once
# The login page: the wallet first (UserHooks).
login:
  css:
    theme:
      css/login.css: {}
