# Ombú in production on SER5 (no DDEV there): `docker compose up -d --build`
# from this directory. The repos sit next to this one, as in DDEV:
#   ombu/ (this repo)  x402_pay/  wallet_auth/  ai_provider_universal/
# Secrets in deploy/.env (git-ignored, mode 600): the sellers' keys, the
# LLM key, Circle's keys, the gas wallet, and the database's MARIADB_*.
name: ombu

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OMBU_PROD: "1"
    # LAN only (minisforum's tunnel forwards here); Docker bypasses UFW, so
    # binding to the LAN address is what keeps it off other interfaces.
    ports:
      - "192.168.1.66:8097:80"
    volumes:
      - ..:/var/www/html
      - ../../x402_pay:/var/www/html/web/modules/custom/x402_pay
      - ../../wallet_auth:/var/www/html/web/modules/custom/wallet_auth
      - ../../ai_provider_universal:/var/www/html/web/modules/custom/ai_provider_universal
    depends_on:
      - db

  db:
    image: mariadb:11.8
    restart: unless-stopped
    env_file: .env
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s

volumes:
  db:
