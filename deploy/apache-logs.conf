# Access logs that survive a rebuild, with what an analysis needs.
#
# The default of the visitor's address is the connection's own (REMOTE_ADDR).
SetEnvIf Remote_Addr "^(.*)$" client_ip=$1

# combined, plus: the time taken in microseconds (%D), the host asked, the
# visitor's country (Cloudflare), what the client accepts (HTML or Markdown)
# and Cloudflare's request id.
LogFormat "%{client_ip}e %l %u %t \"%r\" %>s %B \"%{Referer}i\" \"%{User-Agent}i\" %D %{Host}i %{CF-IPCountry}i \"%{Accept}i\" %{CF-Ray}i" ombu_detailed
