ombu.catalogue:
  path: '/market.json'
  defaults:
    _controller: '\Drupal\ombu\Controller\CatalogueController'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

ombu.openapi:
  path: '/openapi.json'
  defaults:
    _controller: '\Drupal\ombu\Controller\OpenApiController'
  methods: [GET]
  requirements:
    # Public: it describes public endpoints.
    _access: 'TRUE'
